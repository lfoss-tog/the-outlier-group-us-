<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Internal tool: keep it out of search engines -->
<meta name="robots" content="noindex, nofollow">
<title>Create a Listing | The Outlier Group (Internal)</title>
<link rel="icon" type="image/svg+xml" href="listing-intake/icons/listing-intake.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300..600&display=swap">
<link rel="stylesheet" href="listing-intake/intake.css?v=20261009c">
</head>
<body>
<!--
  Listing Intelligence: Create a Listing (internal, 9-step CRE intake)
  Self-contained page. It does not load or change the main site's
  index.html, css/style.css or js/*.js, and the main site doesn't load this.
  Settings: listing-intake/intake-config.js
-->
<div id="listing-intake-root"></div>
<noscript><div class="li-noscript">The Create a Listing tool needs JavaScript turned on.</div></noscript>

<!-- Page markup. Rendered by listing-intake/dc-lite.js from the values in listing-intake/intake-app.js -->
<script type="text/x-template" id="listing-intake-template">
<div class="li-shell">

<header class="li-top">
<a href="index.html" class="li-brand" aria-label="The Outlier Group website"><img src="assets/img/site/og-monogram.png" alt="The Outlier Group"></a>
<span class="li-app">Agent Portal</span>
<div style="flex-grow: 1"></div>
<span class="li-status">{{statusText}}</span>
<button class="li-link li-quiet" type="button" onClick="{{openPreview}}">Preview</button>
<button class="li-link" type="button" onClick="{{openDrawer}}" aria-haspopup="dialog">Listing Summary<sc-if value="{{summaryDot}}" hint-placeholder-val="{{false}}"><span class="li-dot" aria-label="needs attention"></span></sc-if></button>
</header>

<div class="li-body">

<nav class="li-steps" aria-label="Listing steps">
<div class="li-progress" role="progressbar" aria-label="Required fields complete" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}"><div style="width: {{pctW}}"></div></div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
<button type="button" onClick="{{s.pick}}" aria-current="{{s.ariaCur}}" style="{{s.rowStyle}}"><span style="{{s.numStyle}}">{{s.num}}</span><span style="{{s.nameStyle}}">{{s.label}}</span><span style="{{s.markStyle}}" aria-hidden="true">{{s.markText}}</span></button>
</sc-for>
</nav>

<main class="li-main">
<div class="li-scroll">
<div class="li-col">
<p class="li-mstep">{{mobileStep}}</p>
<h1 class="li-title">{{secTitle}}</h1>
<sc-if value="{{hasDesc}}" hint-placeholder-val="{{false}}"><p class="li-desc">{{secDesc}}</p></sc-if>
<sc-if value="{{hasConfLine}}" hint-placeholder-val="{{false}}"><p class="li-desc">{{confLine}}</p></sc-if>

<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<sc-if value="{{hasFields}}" hint-placeholder-val="{{true}}">
<div class="li-grid">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="7">
<div class="f" style="{{f.span}}">
<label class="lbl" for="{{f.id}}">{{f.label}}<sc-if value="{{f.req}}" hint-placeholder-val="{{false}}"><span class="req" aria-label="required">*</span></sc-if></label>
<sc-if value="{{f.isText}}" hint-placeholder-val="{{true}}"><input class="in" id="{{f.id}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="{{f.inStyle}}"></sc-if>
<sc-if value="{{f.isArea}}" hint-placeholder-val="{{false}}"><textarea class="in" id="{{f.id}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="{{f.inStyle}}"></textarea></sc-if>
<sc-if value="{{f.isSelect}}" hint-placeholder-val="{{false}}"><select class="in" id="{{f.id}}" value="{{f.selVal}}" onChange="{{f.set}}" style="{{f.inStyle}}"><sc-for list="{{f.opts}}" as="o" hint-placeholder-count="4"><option>{{o}}</option></sc-for></select></sc-if>
<sc-if value="{{f.isYN}}" hint-placeholder-val="{{false}}"><div class="seg" role="group" aria-label="{{f.label}}"><button type="button" id="{{f.id}}" onClick="{{f.yes}}" style="{{f.yesStyle}}">Yes</button><button type="button" onClick="{{f.no}}" style="{{f.noStyle}}">No</button></div></sc-if>
<sc-if value="{{f.hasHint}}" hint-placeholder-val="{{false}}"><p style="{{f.hintStyle}}">{{f.hint}}</p></sc-if>
<sc-if value="{{f.hasUpload}}" hint-placeholder-val="{{false}}"><div class="li-fup">
<label class="li-fupbtn"><input type="file" multiple="multiple" accept=".pdf,.xls,.xlsx,.csv,.doc,.docx,image/*" onChange="{{f.pickUp}}" aria-label="{{f.upLabel}}"><span aria-hidden="true">+</span>{{f.upLabel}}</label>
<span class="li-fupnote">PDF, Excel, CSV or Word · up to 25 MB · private (never on the website)</span>
<sc-if value="{{f.hasUpFiles}}" hint-placeholder-val="{{false}}"><ul class="li-fuplist"><sc-for list="{{f.upFiles}}" as="u" hint-placeholder-count="1"><li><span class="li-fupname">{{u.name}}</span><span class="li-fupsize">{{u.size}}</span><button type="button" class="li-fuprm" onClick="{{u.remove}}">Remove</button></li></sc-for></ul></sc-if>
</div></sc-if>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{hasCalc}}" hint-placeholder-val="{{false}}"><p class="li-calc">{{calcLine}}</p></sc-if>

<sc-if value="{{hasMore}}" hint-placeholder-val="{{false}}">
<div class="li-more">
<button type="button" class="li-moretoggle" onClick="{{toggleMore}}" aria-expanded="{{moreExp}}"><span class="li-sign" aria-hidden="true">{{moreSign}}</span>{{moreLabel}}<span class="li-morecount">{{moreCount}}</span></button>
<sc-if value="{{moreOpen}}" hint-placeholder-val="{{false}}">
<div class="li-grid" style="margin-top: 32px">
<sc-for list="{{moreFields}}" as="f" hint-placeholder-count="4">
<div class="f" style="{{f.span}}">
<label class="lbl" for="{{f.id}}">{{f.label}}</label>
<sc-if value="{{f.isText}}" hint-placeholder-val="{{true}}"><input class="in" id="{{f.id}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="{{f.inStyle}}"></sc-if>
<sc-if value="{{f.isArea}}" hint-placeholder-val="{{false}}"><textarea class="in" id="{{f.id}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="{{f.inStyle}}"></textarea></sc-if>
<sc-if value="{{f.isSelect}}" hint-placeholder-val="{{false}}"><select class="in" id="{{f.id}}" value="{{f.selVal}}" onChange="{{f.set}}" style="{{f.inStyle}}"><sc-for list="{{f.opts}}" as="o" hint-placeholder-count="4"><option>{{o}}</option></sc-for></select></sc-if>
<sc-if value="{{f.isYN}}" hint-placeholder-val="{{false}}"><div class="seg" role="group" aria-label="{{f.label}}"><button type="button" id="{{f.id}}" onClick="{{f.yes}}" style="{{f.yesStyle}}">Yes</button><button type="button" onClick="{{f.no}}" style="{{f.noStyle}}">No</button></div></sc-if>
<sc-if value="{{f.hasHint}}" hint-placeholder-val="{{false}}"><p style="{{f.hintStyle}}">{{f.hint}}</p></sc-if>
<sc-if value="{{f.hasUpload}}" hint-placeholder-val="{{false}}"><div class="li-fup">
<label class="li-fupbtn"><input type="file" multiple="multiple" accept=".pdf,.xls,.xlsx,.csv,.doc,.docx,image/*" onChange="{{f.pickUp}}" aria-label="{{f.upLabel}}"><span aria-hidden="true">+</span>{{f.upLabel}}</label>
<span class="li-fupnote">PDF, Excel, CSV or Word · up to 25 MB · private (never on the website)</span>
<sc-if value="{{f.hasUpFiles}}" hint-placeholder-val="{{false}}"><ul class="li-fuplist"><sc-for list="{{f.upFiles}}" as="u" hint-placeholder-count="1"><li><span class="li-fupname">{{u.name}}</span><span class="li-fupsize">{{u.size}}</span><button type="button" class="li-fuprm" onClick="{{u.remove}}">Remove</button></li></sc-for></ul></sc-if>
</div></sc-if>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{showUpload}}" hint-placeholder-val="{{false}}">
<label class="li-drop" onDragOver="{{dragOver}}" onDragLeave="{{dragLeave}}" onDrop="{{dropFiles}}" style="{{dropStyle}}">
<input type="file" multiple="multiple" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx" onChange="{{pickFiles}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
<span style="font-size: 16px">Drop photos and documents, or <u>browse</u></span>
</label>

<sc-if value="{{hasUpFields}}" hint-placeholder-val="{{true}}">
<div class="li-grid li-links">
<sc-for list="{{upFields}}" as="f" hint-placeholder-count="1">
<div class="f" style="{{f.span}}">
<label class="lbl" for="{{f.id}}">{{f.label}}</label>
<textarea class="in" id="{{f.id}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="{{f.inStyle}}"></textarea>
<sc-if value="{{f.hasHint}}" hint-placeholder-val="{{false}}"><p style="{{f.hintStyle}}">{{f.hint}}</p></sc-if>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{hasPhotos}}" hint-placeholder-val="{{true}}">
<section class="li-files">
<h2 class="li-h2">Photos <span class="li-count">{{photoCount}}</span></h2>
<div class="li-photos">
<sc-for list="{{photoList}}" as="p" hint-placeholder-count="3">
<figure class="li-photo">
<div class="li-thumb">
<sc-if value="{{p.hasUrl}}" hint-placeholder-val="{{false}}"><img src="{{p.url}}" alt="{{p.name}}"></sc-if>
<sc-if value="{{p.hasTag}}" hint-placeholder-val="{{false}}"><span class="li-tag">{{p.tag}}</span></sc-if>
</div>
<figcaption><sc-if value="{{p.notCover}}" hint-placeholder-val="{{true}}"><button type="button" class="li-mini" onClick="{{p.makeCover}}">Make cover</button></sc-if><button type="button" class="li-mini" onClick="{{p.remove}}" aria-label="Remove {{p.name}}">Remove</button></figcaption>
</figure>
</sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{hasDocs}}" hint-placeholder-val="{{true}}">
<section class="li-files">
<h2 class="li-h2">Documents <span class="li-count">{{docCount}}</span></h2>
<sc-for list="{{docList}}" as="d" hint-placeholder-count="2">
<div class="li-doc">
<span class="li-ext">{{d.ext}}</span>
<span class="li-docname">{{d.name}}</span>
<select class="in li-cat" aria-label="Document type for {{d.name}}" value="{{d.category}}" onChange="{{d.setCategory}}"><sc-for list="{{docCats}}" as="c" hint-placeholder-count="4"><option>{{c}}</option></sc-for></select>
<div class="seg li-docseg" role="group" aria-label="Who can see {{d.name}}"><button type="button" onClick="{{d.setInt}}" style="{{d.intStyle}}">Private</button><button type="button" onClick="{{d.setWeb}}" style="{{d.webStyle}}">On website</button></div>
<button type="button" class="li-mini" style="justify-self: end" onClick="{{d.remove}}" aria-label="Remove {{d.name}}">Remove</button>
</div>
</sc-for>
</section>
</sc-if>
</sc-if>
</sc-if>

<sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
<div class="li-review">
<sc-for list="{{review}}" as="r" hint-placeholder-count="8">
<button type="button" class="li-rrow" onClick="{{r.go}}"><span class="li-rname">{{r.label}}</span><span style="{{r.noteStyle}}">{{r.note}}</span><span class="li-rmark" aria-hidden="true">{{r.mark}}</span><span class="li-redit">Edit</span></button>
</sc-for>
</div>
</sc-if>

</div>
</div>

<footer class="li-foot">
<sc-if value="{{showBack}}" hint-placeholder-val="{{true}}"><button class="li-link" type="button" onClick="{{back}}">Back</button></sc-if>
<span style="{{footerStyle}}">{{footerHint}}</span>
<sc-if value="{{showNext}}" hint-placeholder-val="{{true}}"><button class="btn pri" type="button" onClick="{{next}}">Next: {{nextLabel}}</button></sc-if>
<sc-if value="{{showSubmit}}" hint-placeholder-val="{{false}}"><button class="btn pri" type="button" onClick="{{submit}}">Submit for Review</button></sc-if>
<sc-if value="{{showApprove}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{requestChanges}}">Request Changes</button><button class="btn pri" type="button" onClick="{{approve}}">Approve</button></sc-if>
<sc-if value="{{showRetry}}" hint-placeholder-val="{{false}}"><button class="btn pri" type="button" onClick="{{retry}}">Retry from failed step</button></sc-if>
<sc-if value="{{showPublish}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{openFlyer}}">Open flyer</button><button class="btn" type="button" onClick="{{flyerChanges}}">Request flyer changes</button><button class="btn pri" type="button" onClick="{{publish}}">Approve flyer &amp; Publish</button></sc-if>
<sc-if value="{{showLive}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{unpublish}}">Unpublish</button></sc-if>
</footer>
</main>
</div>

<sc-if value="{{drawer}}" hint-placeholder-val="{{false}}">
<div class="li-scrim" onClick="{{closeDrawer}}"></div>
<aside class="li-drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle">
<div class="row" style="justify-content: space-between; align-items: baseline">
<h2 id="drTitle" class="li-title" style="font-size: 32px; margin: 0">Listing Summary</h2>
<button class="li-link" type="button" onClick="{{closeDrawer}}">Close</button>
</div>

<sc-if value="{{issueCount}}" hint-placeholder-val="{{false}}">
<div>
<p class="sec">Needs attention</p>
<sc-for list="{{issues}}" as="i" hint-placeholder-count="2"><button type="button" onClick="{{i.go}}" style="{{i.style}}"><span>{{i.text}}</span><span style="font-size: 12.5px; color: #6F6C68">{{i.where}}</span></button></sc-for>
</div>
</sc-if>

<div>
<p class="sec">Listing</p>
<div class="kv"><span>Website title</span><b>{{title}}</b></div>
<div class="kv"><span>Listing URL</span><b class="mono">#property-{{slug}}</b></div>
<div class="kv"><span>Region</span><b>{{regionText}}</b></div>
<div class="kv"><span>Offered for</span><b>{{dealText}}</b></div>
<sc-if value="{{isSale}}" hint-placeholder-val="{{false}}"><div class="kv"><span>Price / SF</span><b>{{ppsf}}</b></div></sc-if>
<sc-if value="{{isLease}}" hint-placeholder-val="{{true}}"><div class="kv"><span>Gross rent / SF</span><b>{{grossPsf}}</b></div><div class="kv"><span>Monthly rent</span><b>{{monthly}}</b></div></sc-if>
</div>

<div class="row" style="gap: 12px; flex-wrap: wrap">
<button class="btn" type="button" onClick="{{openPreview}}">Preview on Website</button>
<button class="btn" type="button" onClick="{{exportXlsx}}">Export to Excel</button>
<button class="li-link" type="button" onClick="{{save}}">Save Now</button>
</div>

<div>
<p class="sec">Publishing workflow</p>
<sc-for list="{{pipeline}}" as="w" hint-placeholder-count="7"><div style="{{w.style}}"><span style="display: inline-block; width: 20px">{{w.mark}}</span>{{w.label}}</div></sc-for>
</div>

<div>
<p class="sec">After approval</p>
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
<div class="li-job"><span style="{{j.dotStyle}}">{{j.mark}}</span><span><span style="display: block; font-size: 14px">{{j.label}}</span><span style="{{j.subStyle}}">{{j.sub}}</span></span></div>
</sc-for>
</div>

<sc-if value="{{hasLog}}" hint-placeholder-val="{{true}}">
<div>
<p class="sec">Activity</p>
<sc-for list="{{log}}" as="g" hint-placeholder-count="2"><p class="hint" style="margin: 0 0 6px">{{g}}</p></sc-for>
</div>
</sc-if>

<div>
<button type="button" class="li-moretoggle" onClick="{{toggleAdmin}}" aria-expanded="{{adminExp}}"><span class="li-sign" aria-hidden="true">{{adminSign}}</span>Admin View</button>
<sc-if value="{{admin}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 18px; display: flex; flex-direction: column; gap: 18px">
<div>
<p class="sec">Who sees each field</p>
<div class="kv"><span>Website · published on the listing page</span><b>{{nWeb}}</b></div>
<div class="kv"><span>Internal · Outlier team only</span><b>{{nInt}}</b></div>
<div class="kv"><span>Restricted / NDA · agent, approvers, NDA</span><b>{{nRes}}</b></div>
</div>
<sc-if value="{{hasAdminFields}}" hint-placeholder-val="{{true}}">
<div>
<p class="sec">This step</p>
<sc-for list="{{adminFields}}" as="a" hint-placeholder-count="4"><div class="kv"><span>{{a.label}}</span><b style="font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #6F6C68">{{a.vis}}</b></div></sc-for>
</div>
</sc-if>
<sc-if value="{{showFailPick}}" hint-placeholder-val="{{false}}"><label class="row" style="font-size: 13px; color: #6F6C68; gap: 10px">Demo: simulate a failure<select class="in" value="{{failSim}}" onChange="{{setFailSim}}" style="min-height: 40px; width: 160px; font-size: 14px"><option>None</option><option>Excel step</option><option>Flyer step</option></select></label></sc-if>
<sc-if value="{{showReset}}" hint-placeholder-val="{{false}}"><button class="li-link" type="button" onClick="{{reset}}" style="align-self: flex-start">Start over (demo)</button></sc-if>
</div>
</sc-if>
</div>
</aside>
</sc-if>

<sc-if value="{{preview}}" hint-placeholder-val="{{false}}">
<div class="li-scrim" onClick="{{closePreview}}"></div>
<div class="li-modal" role="dialog" aria-modal="true" aria-labelledby="pvTitle">
<div class="row" style="justify-content: space-between; align-items: baseline">
<h2 id="pvTitle" class="li-title" style="font-size: 30px; margin: 0">{{pvHeading}}</h2>
<button class="li-link" type="button" onClick="{{closePreview}}" aria-label="Close preview">Close</button>
</div>
<div class="li-pv">
<article class="li-card">
<div class="ph" style="height: 220px; position: relative; overflow: hidden">
<sc-if value="{{pvHasImg}}" hint-placeholder-val="{{false}}"><img src="{{pvImg}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 220px; object-fit: cover"></sc-if>
<sc-if value="{{isConf}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; background: rgba(255,255,255,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><b style="font-size: 15px">Off-Market</b><small style="color: #6F6C68">Sign the NDA to view</small></div></sc-if>
<div style="position: absolute; top: 12px; left: 12px; display: flex; gap: 6px"><span class="pill" style="{{pvPillStyle}}">{{pvStatus}}</span><span class="pill" style="background: rgba(255,255,255,.94); color: #000">For {{dealText}}</span></div>
</div>
<div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; letter-spacing: .18em; text-transform: uppercase">{{pvType}}</span>
<span class="li-title" style="font-size: 26px; margin: 0">{{title}}</span>
<span style="font-size: 14px; color: #6F6C68">{{pvLoc}}</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,.08)">
<div><div style="font-size: 11px; color: #6F6C68">Unit &amp; Space</div><div style="font-size: 13.5px">{{pvSpace}}</div></div>
<div><div style="font-size: 11px; color: #6F6C68">Building</div><div style="font-size: 13.5px">{{pvBldg}}</div></div>
<div><div style="font-size: 11px; color: #6F6C68">Min Divisible</div><div style="font-size: 13.5px">{{pvMin}}</div></div>
</div>
<div class="row" style="justify-content: space-between; margin-top: 8px"><span style="font-size: 13.5px; color: #282626">{{pvAgent}}</span><span style="{{pvBtnStyle}}">{{pvBtn}}</span></div>
</div>
</article>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px; min-width: 0">
<p class="sec">#property-{{slug}}</p>
<p style="margin: 0; font-size: 19px">{{pvHeadline}}</p>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #282626">{{pvBody}}</p>
<div>
<sc-for list="{{pvFacts}}" as="x" hint-placeholder-count="5"><div class="kv"><span>{{x.k}}</span><b>{{x.v}}</b></div></sc-for>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" class="li-toast">{{toast}}</div>
</sc-if>
</div>
</script>

<script src="listing-intake/intake-config.js?v=20261009c"></script>
<script src="listing-intake/dc-lite.js?v=20261009c"></script>
<script src="listing-intake/intake-backend.js?v=20261009c"></script>
<script src="listing-intake/intake-app.js?v=20261009c"></script>
</body>
</html>
