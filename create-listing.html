<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Internal tool: keep it out of search engines -->
<meta name="robots" content="noindex, nofollow">
<title>Create a Listing | The Outlier Group (Internal)</title>
<link rel="icon" type="image/svg+xml" href="listing-intake/icons/listing-intake.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@300..700&display=swap">
<link rel="stylesheet" href="listing-intake/intake.css">
</head>
<body>
<!--
  Listing Intelligence: Create a Listing (internal, 9-step CRE intake)
  Self-contained page. It does not load or change the main site's
  index.html, css/style.css or js/*.js, and the main site doesn't load this.
  Settings: listing-intake/intake-config.js
-->
<div id="listing-intake-root"></div>
<noscript><div class="li-noscript">The Create a Listing tool needs JavaScript turned on.</div></noscript>

<!-- Page markup. Rendered by listing-intake/dc-lite.js from the values in listing-intake/intake-app.js -->
<script type="text/x-template" id="listing-intake-template">
<div class="li-shell" style="display: flex; flex-direction: column; background: #FFFFFF; position: relative; overflow: hidden">

<header style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid rgba(20,20,20,0.144); background: #FFFFFF">
<a href="index.html" aria-label="The Outlier Group website" style="display: block; padding-right: 18px; border-right: 1px solid rgba(20,20,20,.16)"><img src="assets/img/site/og-wordmark.png" alt="The Outlier Group" style="height: 34px; width: auto; display: block"></a>
<div style="display: flex; flex-direction: column; line-height: 1.1; gap: 3px">
<span style="font-size: 11px; letter-spacing: .24em; color: #5A5752; font-weight: 600">AGENT PORTAL · INTERNAL</span>
<span class="disp" style="font-size: 24px; font-weight: 600">CRE Listing Intake Form</span>
</div>
<span class="pill" style="background: rgba(20,20,20,0.06); color: #5A5752; border: 1px solid rgba(20,20,20,0.2)">{{dataPill}}</span>
<div style="flex-grow: 1"></div>
<button class="btn" type="button" onClick="{{openPreview}}">Preview</button>
<button class="btn" type="button" onClick="{{exportXlsx}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"></path></svg>Export to Excel</button>
<button class="btn" type="button" onClick="{{save}}">Save as Draft</button>
</header>

<div style="flex-shrink: 0; height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 28px; border-bottom: 1px solid rgba(20,20,20,0.112); background: #FAFAF9">
<span class="sec" style="flex-shrink: 0">Listing status</span>
<nav aria-label="Listing status" style="display: flex; align-items: center; gap: 5px">
<sc-for list="{{wfSteps}}" as="w" hint-placeholder-count="7">
<span style="{{w.style}}">{{w.label}}</span>
<sc-if value="{{w.arrow}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A8782" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
</sc-for>
</nav>
<div style="flex-grow: 1"></div>
<sc-if value="{{showFailPick}}" hint-placeholder-val="{{true}}"><label class="row" style="font-size: 12.5px; color: #5A5752; gap: 8px">Demo: simulate a failure<select class="in" value="{{failSim}}" onChange="{{setFailSim}}" style="min-height: 34px; width: 150px; padding: 4px 10px; font-size: 13px"><option>None</option><option>Excel step</option><option>Flyer step</option></select></label></sc-if>
</div>

<div style="flex-grow: 1; display: flex; min-height: 0">

<aside style="width: 286px; flex-shrink: 0; border-right: 1px solid rgba(20,20,20,0.144); padding: 22px 16px; display: flex; flex-direction: column; gap: 16px; background: #FAFAF9; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #3A3835">Step {{step}} of 9</span><span style="color: #5A5752">{{doneReq}} of {{totalReq}} required filled</span></div>
<div style="height: 6px; border-radius: 99px; background: rgba(20,20,20,0.135); overflow: hidden"><div style="height: 6px; border-radius: 99px; background: #141414; width: {{pctW}}"></div></div>
</div>
<nav aria-label="Sections" style="display: flex; flex-direction: column; gap: 3px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="8">
<button type="button" onClick="{{s.pick}}" style="{{s.rowStyle}}">
<span style="{{s.numStyle}}">{{s.mark}}</span>
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left"><span style="font-size: 14px; line-height: 1.25">{{s.label}}</span><span style="{{s.subStyle}}">{{s.sub}}</span></span>
</button>
</sc-for>
</nav>
<div class="box" style="margin-top: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<p class="sec">Who sees each field</p>
<div class="row" style="font-size: 12.5px; color: #3A3835"><span style="{{bWeb}}">Website</span>published on the listing page</div>
<div class="row" style="font-size: 12.5px; color: #3A3835"><span style="{{bInt}}">Internal</span>Outlier team only</div>
<div class="row" style="font-size: 12.5px; color: #3A3835"><span style="{{bRes}}">Restricted</span>agent + approvers only</div>
<div class="row" style="font-size: 12.5px; color: #3A3835"><span style="{{bNda}}">NDA</span>released after NDA approval</div>
</div>
</aside>

<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<div style="flex-grow: 1; overflow-y: auto; padding: 28px 36px 28px">

<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 900px">
<div><p class="sec">{{secKicker}}</p><h1 class="disp" style="margin: 4px 0 6px; font-size: 36px; font-weight: 600">{{secTitle}}</h1><p class="hint" style="font-size: 14.5px">{{secDesc}}</p></div>

<sc-if value="{{showAddrNote}}" hint-placeholder-val="{{false}}">
<div class="note ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span>Address found. City, State, Zip, County and Region were filled in automatically; check them before moving on.</span></div>
</sc-if>
<sc-if value="{{showOwnerNote}}" hint-placeholder-val="{{false}}">
<div class="note amber"><span><b>Restricted section.</b> Owner and decision-maker details never appear on the website, in exports to marketing sites, or in AI prompts. Only the assigned agent and approvers can see them.</span></div>
</sc-if>
<sc-if value="{{showConfNote}}" hint-placeholder-val="{{false}}">
<div class="note off"><span><b>Confidential listing is on</b> (Section 7). Fields marked NDA stay private and are released only after a signed NDA is approved. The website shows a locked teaser.</span></div>
</sc-if>

<div class="g3">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="9">
<div class="f" style="{{f.span}}">
<label class="lbl" for="{{f.id}}"><span>{{f.label}}</span><sc-if value="{{f.req}}" hint-placeholder-val="{{false}}"><span class="req">*</span></sc-if><span style="{{f.badgeStyle}}">{{f.badge}}</span><sc-if value="{{f.auto}}" hint-placeholder-val="{{false}}"><span class="auto">Auto</span></sc-if><sc-if value="{{f.added}}" hint-placeholder-val="{{false}}"><span class="added">Added</span></sc-if></label>
<sc-if value="{{f.isText}}" hint-placeholder-val="{{true}}"><input class="in" id="{{f.id}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="{{f.inStyle}}"></sc-if>
<sc-if value="{{f.isArea}}" hint-placeholder-val="{{false}}"><textarea class="in" id="{{f.id}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="{{f.inStyle}}"></textarea></sc-if>
<sc-if value="{{f.isSelect}}" hint-placeholder-val="{{false}}"><select class="in" id="{{f.id}}" value="{{f.val}}" onChange="{{f.set}}" style="{{f.inStyle}}"><sc-for list="{{f.opts}}" as="o" hint-placeholder-count="4"><option>{{o}}</option></sc-for></select></sc-if>
<sc-if value="{{f.isYN}}" hint-placeholder-val="{{false}}"><div class="seg" role="group" aria-label="{{f.label}}"><button type="button" id="{{f.id}}" onClick="{{f.yes}}" style="{{f.yesStyle}}">Yes</button><button type="button" onClick="{{f.no}}" style="{{f.noStyle}}">No</button></div></sc-if>
<sc-if value="{{f.hasHint}}" hint-placeholder-val="{{false}}"><p style="{{f.hintStyle}}">{{f.hint}}</p></sc-if>
</div>
</sc-for>
</div>

<sc-if value="{{showSkip}}" hint-placeholder-val="{{false}}">
<div class="note info"><span>{{skipText}}</span></div>
</sc-if>

<sc-if value="{{showUpload}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 22px">
<label onDragOver="{{dragOver}}" onDragLeave="{{dragLeave}}" onDrop="{{dropFiles}}" style="{{dropStyle}}">
<input type="file" multiple="multiple" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx" onChange="{{pickFiles}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
<span style="font-size: 16px; font-weight: 500">Drag files here, or <span style="color: #141414; text-decoration: underline">browse your computer</span></span>
<span class="hint">Photos: JPG, PNG, WebP · Documents: PDF, Word, Excel, PowerPoint · up to 25 MB each</span>
</label>

<div class="f">
<div class="row" style="justify-content: space-between"><span class="lbl" style="font-size: 15px; color: #141414">Photos ({{photoCount}})</span><span class="hint">{{photoRule}}</span></div>
<sc-if value="{{noPhotos}}" hint-placeholder-val="{{false}}"><p class="hint">No photos yet.</p></sc-if>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{photoList}}" as="p" hint-placeholder-count="3">
<div style="border: 1px solid rgba(20,20,20,0.162); border-radius: 14px; overflow: hidden; background: rgba(20,20,20,0.028); display: flex; flex-direction: column">
<div class="ph" style="height: 120px; border-radius: 0; position: relative; overflow: hidden">
<sc-if value="{{p.hasUrl}}" hint-placeholder-val="{{false}}"><img src="{{p.url}}" alt="{{p.name}}" style="width: 100%; height: 120px; object-fit: cover; display: block"></sc-if>
<sc-if value="{{p.noUrl}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5l8-2v18M12 8l8 2v11M3 21h18M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2"></path></svg></sc-if>
<span class="pill" style="{{p.tagStyle}}">{{p.tag}}</span>
</div>
<div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: #141414; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.webName}}</span>
<span class="hint" style="font-size: 11.5px">{{p.meta}}</span>
<div class="row" style="gap: 6px; margin-top: 4px">
<button type="button" onClick="{{p.makeCover}}" style="{{p.coverBtnStyle}}">{{p.coverLabel}}</button>
<button type="button" onClick="{{p.remove}}" aria-label="Remove {{p.name}}" style="min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(20,20,20,0.24); background: transparent; color: #141414; font: inherit; font-size: 12px; cursor: pointer">Remove</button>
</div>
</div>
</div>
</sc-for>
</div>
</div>

<div class="f">
<div class="row" style="justify-content: space-between"><span class="lbl" style="font-size: 15px; color: #141414">Documents ({{docCount}})</span><span class="hint">Stored in the listing's private Drive folder</span></div>
<sc-if value="{{noDocs}}" hint-placeholder-val="{{false}}"><p class="hint">No documents yet.</p></sc-if>
<div class="box" style="padding: 4px 16px">
<sc-for list="{{docList}}" as="d" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 210px 240px 84px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(20,20,20,0.108)">
<div class="row" style="min-width: 0"><span style="{{d.extStyle}}">{{d.ext}}</span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{d.name}}</span><span class="hint" style="font-size: 11.5px">{{d.meta}}</span></span></div>
<select class="in" aria-label="Document type for {{d.name}}" value="{{d.category}}" onChange="{{d.setCategory}}" style="min-height: 38px; padding: 6px 10px; font-size: 13.5px"><sc-for list="{{docCats}}" as="c" hint-placeholder-count="4"><option>{{c}}</option></sc-for></select>
<div class="seg" role="group" aria-label="Who can see {{d.name}}" style="padding: 3px"><button type="button" onClick="{{d.setWeb}}" style="{{d.webStyle}}">Website download</button><button type="button" onClick="{{d.setInt}}" style="{{d.intStyle}}">Internal</button></div>
<button type="button" onClick="{{d.remove}}" aria-label="Remove {{d.name}}" style="min-height: 36px; border-radius: 999px; border: 1px solid rgba(20,20,20,0.24); background: transparent; color: #141414; font: inherit; font-size: 12.5px; cursor: pointer">Remove</button>
</div>
</sc-for>
</div>
<p class="hint">"Website download" adds the file to the property page (e.g. a flyer or floor plan). Rent rolls, reports and surveys should stay Internal.</p>
</div>

<sc-if value="{{isConf}}" hint-placeholder-val="{{false}}"><div class="note off"><span><b>Confidential listing:</b> photos and downloads are NDA-only. They're released only after an NDA is approved, never shown on the public teaser.</span></div></sc-if>
<div class="note info"><span>Uploading here also answers your template's <b>Photos Available?</b>, <b>Floor Plan Available?</b> and <b>Site Plan / Survey Available?</b> questions automatically.</span></div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 920px">
<div><p class="sec">Step 9</p><h1 class="disp" style="margin: 4px 0 6px; font-size: 36px; font-weight: 600">Review &amp; Submit</h1><p class="hint" style="font-size: 14.5px">Every section of the intake form, what's missing, and where each answer will go.</p></div>
<div class="box" style="padding: 4px 20px">
<sc-for list="{{review}}" as="r" hint-placeholder-count="7">
<div class="kv" style="align-items: center; padding: 11px 0"><span style="color: #141414; font-size: 14.5px; width: 290px">{{r.label}}</span><span style="font-size: 13px; color: #5A5752; flex-grow: 1">{{r.count}}</span><span style="{{r.style}}">{{r.state}}</span><button type="button" onClick="{{r.go}}" style="border: 0; background: none; color: #141414; font: inherit; font-size: 13.5px; cursor: pointer; min-height: 36px; padding: 0 0 0 14px">Edit</button></div>
</sc-for>
</div>
<div class="g3" style="gap: 14px">
<div class="box"><p class="sec" style="margin-bottom: 6px">Website</p><b class="disp" style="font-size: 32px">{{nWeb}}</b><p class="hint">fields published on the listing page and card</p></div>
<div class="box"><p class="sec" style="margin-bottom: 6px">Internal</p><b class="disp" style="font-size: 32px">{{nInt}}</b><p class="hint">fields kept in the Listing Intake sheet</p></div>
<div class="box"><p class="sec" style="margin-bottom: 6px">Restricted / NDA</p><b class="disp" style="font-size: 32px">{{nRes}}</b><p class="hint">owner contacts, lockbox, confidential details</p></div>
</div>
<div class="note info"><span><b>Export to Excel</b> fills a copy of your own "CRE Listing Intake Form" template, same rows and labels, named <b>{{fileName}}</b>.</span></div>
</div>
</sc-if>

</div>

<footer style="flex-shrink: 0; height: 76px; border-top: 1px solid rgba(20,20,20,0.144); display: flex; align-items: center; gap: 12px; padding: 0 36px; background: #FFFFFF">
<button class="btn" type="button" onClick="{{back}}">Back</button>
<span class="hint" style="flex-grow: 1">{{footerHint}}</span>
<sc-if value="{{showNext}}" hint-placeholder-val="{{true}}"><button class="btn pri" type="button" onClick="{{next}}">Next: {{nextLabel}}</button></sc-if>
<sc-if value="{{showSubmit}}" hint-placeholder-val="{{false}}"><button class="btn pri" type="button" onClick="{{submit}}">Submit for Review</button></sc-if>
<sc-if value="{{showApprove}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{requestChanges}}">Request Changes</button><button class="btn pri" type="button" onClick="{{approve}}">Approve</button></sc-if>
<sc-if value="{{showRetry}}" hint-placeholder-val="{{false}}"><button class="btn pri" type="button" onClick="{{retry}}">Retry from failed step</button></sc-if>
<sc-if value="{{showPublish}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{openFlyer}}">Open flyer PDF</button><button class="btn" type="button" onClick="{{flyerChanges}}">Request flyer changes</button><button class="btn pri" type="button" onClick="{{publish}}">Approve flyer &amp; Publish</button></sc-if>
<sc-if value="{{showLive}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{unpublish}}">Unpublish</button><sc-if value="{{showReset}}" hint-placeholder-val="{{false}}"><button class="btn" type="button" onClick="{{reset}}">Start over (demo)</button></sc-if></sc-if>
</footer>
</main>

<aside style="width: 320px; flex-shrink: 0; border-left: 1px solid rgba(20,20,20,0.144); padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; background: #FAFAF9">
<h2 class="disp" style="margin: 0; font-size: 24px; font-weight: 600">Automation</h2>
<p class="hint" style="margin-top: -10px">Updates as you type. Every value can be overridden.</p>
<div class="box" style="padding: 4px 16px">
<div class="kv"><span>Website title</span><b>{{title}}</b></div>
<div class="kv"><span>Listing URL</span><b style="font-family: ui-monospace, Menlo, monospace; font-size: 11.5px">#property-{{slug}}</b></div>
<div class="kv"><span>County → Region</span><b>{{countyRegion}}</b></div>
<div class="kv"><span>Offered for</span><b>{{dealText}}</b></div>
<div class="kv"><span>Price / SF</span><b>{{ppsf}}</b></div>
<div class="kv"><span>Total gross rent / PSF</span><b>{{grossPsf}}</b></div>
<div class="kv" style="border: 0"><span>Total monthly rent</span><b>{{monthly}}</b></div>
</div>
<div class="note ok" style="font-size: 13px"><span><b>Duplicate check passed.</b> No listing, draft or off-market property at this address or parcel.</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p class="sec">Needs attention ({{issueCount}})</p>
<sc-if value="{{noIssues}}" hint-placeholder-val="{{false}}"><p class="hint">Nothing missing. Ready for review.</p></sc-if>
<sc-for list="{{issues}}" as="i" hint-placeholder-count="2">
<button type="button" onClick="{{i.go}}" style="{{i.style}}"><span style="font-weight: 600">{{i.where}}</span><span>{{i.text}}</span></button>
</sc-for>
</div>
<div class="box" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<p class="sec">After approval (backend)</p>
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span style="{{j.dotStyle}}">{{j.mark}}</span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 13px; color: #141414">{{j.label}}</span><span style="{{j.subStyle}}">{{j.sub}}</span></span>
</div>
</sc-for>
</div>
<div class="box" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<p class="sec">Activity</p>
<sc-for list="{{log}}" as="g" hint-placeholder-count="2"><p style="margin: 0; font-size: 12.5px; color: #3A3835; line-height: 1.5">{{g}}</p></sc-for>
</div>
</aside>
</div>

<sc-if value="{{preview}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(20,20,20,.45); display: flex; align-items: center; justify-content: center; z-index: 5">
<div role="dialog" aria-modal="true" aria-labelledby="pvTitle" style="width: 1060px; background: #FFFFFF; border: 1px solid rgba(20,20,20,0.24); border-radius: 22px; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 24px 60px rgba(20,20,20,.14)">
<div class="row" style="justify-content: space-between">
<div><p class="sec">Preview · what the website will show</p><h2 id="pvTitle" class="disp" style="margin: 4px 0 0; font-size: 30px; font-weight: 600">{{pvHeading}}</h2></div>
<button class="btn" type="button" onClick="{{closePreview}}" aria-label="Close preview">Close</button>
</div>
<div style="display: flex; gap: 26px; align-items: flex-start">
<article style="width: 370px; flex-shrink: 0; border-radius: 18px; overflow: hidden; border: 1px solid rgba(20,20,20,0.144); background: rgba(20,20,20,0.044)">
<div class="ph" style="height: 220px; border-radius: 0; position: relative; overflow: hidden">
<sc-if value="{{pvHasImg}}" hint-placeholder-val="{{false}}"><img src="{{pvImg}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 220px; object-fit: cover"></sc-if>
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5l8-2v18M12 8l8 2v11M3 21h18M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2"></path></svg>
<sc-if value="{{isConf}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; background: rgba(255,255,255,.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><b style="font-size: 15px">Off-Market</b><small style="color: #3A3835">Sign the NDA to view</small></div></sc-if>
<div style="position: absolute; top: 12px; left: 12px; display: flex; gap: 6px"><span class="pill" style="{{pvPillStyle}}">{{pvStatus}}</span><span class="pill" style="background: rgba(255,255,255,.92); color: #141414">For {{dealText}}</span></div>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 7px">
<span style="font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #141414">{{pvType}}</span>
<span class="disp" style="font-size: 25px; font-weight: 600; line-height: 1.1">{{title}}</span>
<span style="font-size: 13.5px; color: #5A5752">{{pvLoc}}</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; padding-top: 12px; border-top: 1px solid rgba(20,20,20,0.126)">
<div><div style="font-size: 10.5px; color: #5A5752">Unit # &amp; Space</div><div style="font-size: 13px">{{pvSpace}}</div></div>
<div><div style="font-size: 10.5px; color: #5A5752">Building Size</div><div style="font-size: 13px">{{pvBldg}}</div></div>
<div><div style="font-size: 10.5px; color: #5A5752">Min Divisible</div><div style="font-size: 13px">{{pvMin}}</div></div>
</div>
<div class="row" style="justify-content: space-between; margin-top: 6px"><span style="font-size: 13px; color: #3A3835">{{pvAgent}}</span><span style="{{pvBtnStyle}}">{{pvBtn}}</span></div>
</div>
</article>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
<p class="sec">Property page · #property-{{slug}}</p>
<p style="margin: 0; font-size: 18px; color: #141414">{{pvHeadline}}</p>
<p style="margin: 0; font-size: 14.5px; line-height: 1.65; color: #3A3835">{{pvBody}}</p>
<div class="box" style="padding: 4px 18px">
<sc-for list="{{pvFacts}}" as="x" hint-placeholder-count="5"><div class="kv"><span>{{x.k}}</span><b>{{x.v}}</b></div></sc-for>
</div>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); background: #141414; color: #FFFFFF; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: 0 12px 30px rgba(20,20,20,.14); z-index: 6">{{toast}}</div>
</sc-if>
</div>
</script>

<script src="listing-intake/intake-config.js"></script>
<script src="listing-intake/dc-lite.js"></script>
<script src="listing-intake/intake-backend.js"></script>
<script src="listing-intake/intake-app.js"></script>
</body>
</html>
